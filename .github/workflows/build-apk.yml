name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "❌ No zip file found in repo root"; exit 1
          fi
          echo "✅ Found zip: $ZIP"
          mkdir -p _project
          unzip -o "$ZIP" -d _project
          GRADLEW=$(find _project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "❌ gradlew not found after extraction"; exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "✅ Project directory: $DIR"

      - name: Remove local.properties if exists
        run: rm -f "$PROJECT_DIR/local.properties"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        run: cd "$PROJECT_DIR" && ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
