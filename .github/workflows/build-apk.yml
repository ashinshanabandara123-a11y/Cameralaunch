name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "❌ No zip file found in repo root"; exit 1
          fi
          echo "✅ Found zip: $ZIP"
          mkdir -p _project
          unzip -o "$ZIP" -d _project
          BUILD_GRADLE=$(find _project -name "build.gradle*" -type f | head -n 1)
          if [ -z "$BUILD_GRADLE" ]; then
            echo "❌ build.gradle not found after extraction"; exit 1
          fi
          DIR=$(dirname "$BUILD_GRADLE")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "✅ Project directory: $DIR"

      - name: Remove local.properties if exists
        run: rm -f "$PROJECT_DIR/local.properties"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'   # ← 8.7 සිට 8.9 ට වෙනස් කළා

      - name: Build Debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
